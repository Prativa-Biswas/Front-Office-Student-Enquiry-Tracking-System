<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8" />
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no" />
<meta http-equiv="x-ua-compatible" content="ie=edge" />
<title>Tech Solutions - View Enquries</title>
<!-- MDB icon -->
<link rel="icon" href="img/mdb-favicon.ico" type="image/x-icon" />
<!-- Font Awesome -->
<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.15.2/css/all.css" />
<!-- Google Fonts Roboto -->
<link rel="stylesheet"
	href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" />
<!-- MDB -->
<link rel="stylesheet" href="css/bootstrap-login-form.min.css" />

<body>


<div class="table-responsive" >

									<table class="table table-striped table-bordered table-hover">
										<thead>
											<tr>
												<th scope="col">#</th>
												<th scope="col">Name</th>
												<th scope="col">Course</th>
												<th scope="col">Number</th>
												<th scope="col">Enquiry Date</th>
												<th scope="col">Status</th>
												<th scope="col">Class Mode</th>
												<th scope="col">Action</th>
											</tr>
										</thead>
										<tbody>
											<tr th:each="enq: ${enquiries}">
												<td th:text="${enqStat.index +1}"></td>
												<td th:text="${enq.studentName}"></td>
												<td th:text="${enq.courseName}"></td>
												<td th:text="${enq.contactNo}"></td>
												<td th:text="${enq.enquiryDate}"></td>
												<td th:text="${enq.enquiryStatus}"></td>
												<td th:text="${enq.classMode}"></td>
												<td>
												   <form th:action="@{/edit}" method="get">
												   <input type="hidden" th:name="enquiryId" th:value="${enq.enquiryId}" />
												   <button type="submit" class="btn btn-primary">Edit</button>
												   </form>
												</td>
												<!-- <td><a href="edit" class="btn btn-primary">Edit</a></td> -->
											</tr>
											
										</tbody>
									</table>
                                   </div>




<!-- End your project here-->

	<!-- MDB -->
	<script type="text/javascript" src="js/mdb.min.js"></script>
	<!-- Custom scripts -->
	<script type="text/javascript"></script>
</body>
</html>
